        try {

            unityInstance.Module.WebGLInput.captureAllKeyboardInput = false;
            console.log('[Auth] Disabled Unity captureAllKeyboardInput so login inputs work');

  <!-- Voice Button Handler -->
  <script>
    (function () {
      const btn = document.getElementById("voiceBtn");
      const indicator = document.getElementById("voiceIndicator");
      let enabled = false;
      let isMuted = false;

      btn.onclick = function () {
        if (!window.unityInstance) return;

        if (!enabled) {
          // First Time: Enable Voice
          unlockAudioContext();
          window.unityInstance.SendMessage("VoiceManager", "StartVoice");

          enabled = true;
          window.__voiceEnabled = true; // shared so the camera button can check
          btn.classList.add('active');
          btn.querySelector('.voice-text').textContent = "Mute Mic";
          indicator.classList.add('active');
          console.log("[Voice] Enabled via user gesture");
        } else {
          // Interaction: Toggle Mute
          isMuted = !isMuted;
          window.unityInstance.SendMessage("VoiceManager", "SetMute", isMuted ? 1 : 0);

          if (isMuted) {
            btn.querySelector('.voice-text').textContent = "Unmute";
            btn.style.backgroundColor = "#ff4444"; // Visual feedback
            indicator.style.opacity = "0.3";
          } else {
            btn.querySelector('.voice-text').textContent = "Mute Mic";
            btn.style.backgroundColor = ""; // Reset
            indicator.style.opacity = "1";
          }
        }
      };
    })();
  </script>

  <!-- Camera Button Handler -->
  <script>
    (function () {
      const camBtn = document.getElementById("cameraBtn");
      if (!camBtn) return;
      let camOn = false;

      camBtn.onclick = function () {
        if (!window.unityInstance) return;

        // Camera needs the Agora channel joined. If voice isn't enabled yet,
        // enable it from THIS same click gesture so the channel joins and the
        // mic publishes — then request the camera. (Browsers grant camera
        // permission most reliably when the request originates from a user
        // gesture; piggybacking on this click avoids the camera silently
        // failing to prompt.)
        if (!window.__voiceEnabled) {
          unlockAudioContext();
          window.unityInstance.SendMessage("VoiceManager", "StartVoice");
          window.__voiceEnabled = true;
          // Reflect voice-on state on the voice button too.
          var vb = document.getElementById("voiceBtn");
          if (vb) {
            vb.classList.add('active');
            var vt = vb.querySelector('.voice-text'); if (vt) vt.textContent = "Mute Mic";
          }
          var ind = document.getElementById("voiceIndicator");
          if (ind) ind.classList.add('active');
          console.log("[Voice] Enabled via camera button gesture");
        }

        camOn = !camOn;
        window.unityInstance.SendMessage("VoiceManager", "SetCamera", camOn ? 1 : 0);

        if (camOn) {
          camBtn.classList.add('active');
          camBtn.querySelector('.cam-text').textContent = "Camera On";
        } else {
          camBtn.classList.remove('active');
          camBtn.querySelector('.cam-text').textContent = "Camera";
        }
        console.log("[Camera] Button toggled:", camOn);
      };
    })();
  </script>

      screenBtn.onclick = function () {

  <!-- Authentication Handlers -->
  <script>
    // Function to hide the auth overlay
    window.hideAuthOverlay = function () {
      const overlay = document.getElementById('auth-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 500);
      }
    };

    // Wait for buttons to be clicked, then call Firebase directly
    // (These functions work because Firebase is loaded in the browser, not Unity)

    // Track whether we're in Sign In or Sign Up mode
    var isSignUpMode = false;

    // FIX: Prevent Unity from swallowing keyboard input while the user is typing
    // in an HTML field (login/signup). Unity installs document-level key
    // listeners that call preventDefault() on every key, which stops characters
    // from being entered into <input> elements.
    //
    // A capture-phase listener on `window` runs BEFORE Unity's document-level
    // listener (window is the outermost ancestor in capture order). When the
    // focused element is a text field, we stopImmediatePropagation() so the
    // event never reaches Unity — but we deliberately do NOT preventDefault(),
    // so the character is still typed into the field normally.
    function isEditableTarget(t) {
      if (!t) return false;
      var tag = t.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || t.isContentEditable === true;
    }
    function guardKeyboardForInputs(e) {
      if (isEditableTarget(e.target)) {
        e.stopImmediatePropagation();
      }
    }
    ['keydown', 'keyup', 'keypress'].forEach(function (type) {
      window.addEventListener(type, guardKeyboardForInputs, true);
    });

    // Cursor-follow glow on the auth card (purely cosmetic).
    (function () {
      var card = document.querySelector('.auth-card');
      if (!card) return;
      card.addEventListener('pointermove', function (e) {
        var r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    })();

    // Helper to construct user data and check admin status
    // Helper to construct user data and check admin status
    function processUserAndSend(user) {
      // 1. Construct basic user data
      var safeName = 'Guest_' + user.uid.substring(0, 8);
      if (user.displayName) {
        safeName = user.displayName;
      } else if (user.email) {
        safeName = user.email.split('@')[0];
      }

      var userDataObj = {
        userId: user.uid,
        displayName: safeName,
        email: user.email || "",
        photoURL: user.photoURL || "",
        isAnonymous: user.isAnonymous,
        isAdmin: false // Default to false
      };

      // Admin status: the signed-in EMAIL is matched against the admin list at
      // /admin_emails in the Realtime Database (a comma-separated string of
      // emails). RTDB rules make that node read-only to clients, so admins can
      // only be changed from the Firebase console — manage clients' admins by
      // simply adding their email there. Match is case-insensitive + trimmed.
      var myEmail = (user.email || "").trim().toLowerCase();
      console.log('[Auth] Reading /admin_emails from RTDB to check:', myEmail);

      firebase.database().ref('admin_emails').once('value')
        .then(function (snap) {
          var isAdmin = false;
          if (myEmail && snap.exists()) {
            var raw = snap.val();
            var list = [];
            if (typeof raw === 'string') {
              list = raw.split(',');
            } else if (raw && typeof raw === 'object') {
              // Also support a { "email": true } object form.
              list = Object.keys(raw);
            }
            isAdmin = list.some(function (e) {
              return String(e).trim().toLowerCase() === myEmail;
            });
          }
          userDataObj.isAdmin = isAdmin;
          console.log('[Auth] isAdmin =', isAdmin);

          // Reveal the admin-only screen-share button.
          window.__isAdmin = isAdmin;
          if (isAdmin) {
            var sb = document.getElementById('screenBtn');
            if (sb) sb.style.display = '';
          }

          var finalJson = JSON.stringify(userDataObj);
          window.hideAuthOverlay();
          waitForUnityAndSend(finalJson);
        })
        .catch(function (err) {
          // Read failed (network, rules, etc). Send the user through as
          // non-admin rather than blocking login — they still get to play.
          console.error('[Auth] admin_emails read failed, defaulting to non-admin:', err);
          userDataObj.isAdmin = false;

          var finalJson = JSON.stringify(userDataObj);
          window.hideAuthOverlay();
          waitForUnityAndSend(finalJson);
        });
    }

    // Toggle between Sign In and Sign Up
    document.getElementById('toggleAuth').onclick = function (e) {
      e.preventDefault();
      isSignUpMode = !isSignUpMode;

      var subtitle = document.getElementById('auth-subtitle');
      var btnText = document.getElementById('emailAuthBtnText');
      var togglePrompt = document.getElementById('togglePrompt');
      var toggleLink = document.getElementById('toggleAuth');

      if (isSignUpMode) {
        subtitle.textContent = 'Create an account to get started';
        btnText.textContent = 'Sign Up';
        togglePrompt.textContent = 'Already have an account?';
        toggleLink.textContent = 'Sign In';
      } else {
        subtitle.textContent = 'Sign in to join the metaverse';
        btnText.textContent = 'Sign In';
        togglePrompt.textContent = "Don't have an account?";
        toggleLink.textContent = 'Sign Up';
      }
    };

    // Visual feedback helper: show a spinner on the clicked button and disable
    // all auth buttons so the user can see the click registered. Pass null to
    // clear (on failure) and re-enable everything.
    function setAuthBusy(activeBtn) {
      var btns = document.querySelectorAll('.auth-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('is-loading');
        if (activeBtn) {
          if (btns[i] === activeBtn) {
            btns[i].classList.add('is-loading');
          } else {
            btns[i].disabled = true;
          }
        } else {
          btns[i].disabled = false;
        }
      }
    }

    // Email/Password Authentication Button
    document.getElementById('emailAuthBtn').onclick = function () {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        alert('Please enter both email and password');
        return;
      }

      if (window.__authInProgress) { console.log('[Auth] Sign-in already in progress — ignoring extra click'); return; }
      window.__authInProgress = true;
      setAuthBusy(this);

      if (isSignUpMode) {
        // Sign Up
        console.log('[Auth] Email Sign Up clicked');
        firebase.auth().createUserWithEmailAndPassword(email, password)
          .then(function (result) {
            console.log('[Auth] Sign up successful');
            processUserAndSend(result.user);
          })
          .catch(function (error) {
            window.__authInProgress = false;
            setAuthBusy(null);
            console.error('[Auth] Sign up failed:', error);
            alert('Sign up failed: ' + error.message);
          });
      } else {
        // Sign In
        console.log('[Auth] Email Sign In clicked');
        firebase.auth().signInWithEmailAndPassword(email, password)
          .then(function (result) {
            console.log('[Auth] Email sign-in successful');
            processUserAndSend(result.user);
          })
          .catch(function (error) {
            window.__authInProgress = false;
            console.error('[Auth] Email sign-in failed:', error);
            alert('Sign in failed: ' + error.message);
          });
      }
    };

    // Google Sign In Button
    document.getElementById('googleSignInBtn').onclick = function () {
      if (window.__authInProgress) { console.log('[Auth] Sign-in already in progress — ignoring extra click'); return; }
      window.__authInProgress = true;

      console.log('[Auth] Google Sign In clicked');

      var provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider).then(function (result) {
        console.log('[Auth] Google sign-in successful');
        processUserAndSend(result.user);
      }).catch(function (error) {
        window.__authInProgress = false;
        console.error('[Auth] Google sign-in failed:', error);
        alert('Sign in failed: ' + error.message);
      });
    };

    // Guest Sign In Button
    document.getElementById('guestSignInBtn').onclick = function () {
      // Guard: ignore repeat clicks while a sign-in is already in progress, so
      // a fast double/triple click can't fire multiple logins (each of which
      // would re-send OnLoginSuccess and re-connect Photon).
      if (window.__authInProgress) { console.log('[Auth] Sign-in already in progress — ignoring extra click'); return; }
      window.__authInProgress = true;

      console.log('[Auth] Guest Sign In clicked');

      firebase.auth().signInAnonymously().then(function (result) {
        console.log('[Auth] Guest sign-in successful');
        processUserAndSend(result.user);
      }).catch(function (error) {
        window.__authInProgress = false; // allow retry on failure
        console.error('[Auth] Guest sign-in failed:', error);
        alert('Sign in failed: ' + error.message);
      });
    };

    // Helper function to wait for Unity and send auth data
    function waitForUnityAndSend(userData) {
      var checkUnity = setInterval(function () {
        if (window.unityInstance) {
          clearInterval(checkUnity);
          console.log('[Auth] Sending to Unity AuthManager:', userData);
          window.unityInstance.SendMessage('AuthManager', 'OnLoginSuccess', userData);
        } else {
          console.log('[Auth] Waiting for Unity to load...');
        }
      }, 100); // Check every 100ms
    }
  </script>

  <!-- ============================================================
       Agora UI extras (live, no Unity rebuild needed):
       1) Green speaking border on a user's camera tile while they talk.
       2) Click a tile to open it big so everyone can see a screen share.
       Tiles are created by AgoraBridge.jslib; we enhance them from here by
       reaching into the shared window.AgoraState the bridge sets up.
       ============================================================ -->
  <script>
    (function () {
      var SPEAK_THRESHOLD = 5;   // Agora volume 0..100; >5 ≈ actively talking.

      function tileUidFromEl(tileEl) {
        // tile id is "agora-tile-<uid>"
        var m = /^agora-tile-(.+)$/.exec(tileEl.id || "");
        return m ? m[1] : null;
      }

      // Resolve the live video track for a uid from the bridge's state, so we
      // can replay it into the big stage. Agora tracks can play into multiple
      // elements at once, so this does not disturb the small tile.
      function videoTrackForUid(uid) {
        var A = window.AgoraState;
        if (!A) return null;
        if (String(uid) === String(A.myUid)) return A.screenTrack || A.camTrack || null;
        return (A.remoteVideo && A.remoteVideo[uid]) || null;
      }

      function labelForUid(uid) {
        var lbl = document.getElementById("agora-tile-" + uid + "-label");
        return (lbl && lbl.textContent) || String(uid);
      }

      // ---- Big "stage" view -------------------------------------------------
      var stage = document.getElementById("agora-stage");
      var stageVideo = document.getElementById("agora-stage-video");
      var stageLabel = document.getElementById("agora-stage-label");
      var stageClose = document.getElementById("agora-stage-close");
      var stageTrack = null;

      function closeStage() {
        if (stageTrack) { try { stageTrack.stop(); } catch (e) {} stageTrack = null; }
        if (stageVideo) stageVideo.innerHTML = "";
        if (stage) stage.classList.remove("visible");
      }

      function openStage(uid) {
        var track = videoTrackForUid(uid);
        if (!track) { console.warn("[AgoraUI] No video track to expand for", uid); return; }
        if (stageTrack) { try { stageTrack.stop(); } catch (e) {} }
        stageTrack = track;
        stageVideo.innerHTML = "";
        stageLabel.textContent = labelForUid(uid);
        stage.classList.add("visible");
        // Play into the big element (id required by Agora's play()).
        try { track.play("agora-stage-video"); }
        catch (e) { console.error("[AgoraUI] stage play failed:", e); }
      }

      if (stageClose) stageClose.onclick = closeStage;
      if (stage) stage.addEventListener("click", function (e) {
        if (e.target === stage) closeStage(); // click backdrop to close
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && stage && stage.classList.contains("visible")) closeStage();
      });

      // Add an expand button + click-to-expand to any tile that appears.
      function enhanceTile(tileEl) {
        if (!tileEl || tileEl.__enhanced) return;
        tileEl.__enhanced = true;
        var uid = tileUidFromEl(tileEl);
        if (!uid) return;

        var btn = document.createElement("button");
        btn.className = "agora-tile-expand";
        btn.title = "Open big";
        btn.innerHTML =
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline>' +
          '<line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>';
        btn.onclick = function (ev) { ev.stopPropagation(); openStage(uid); };
        tileEl.appendChild(btn);

        tileEl.addEventListener("click", function () { openStage(uid); });
      }

      // Tiles are added/removed dynamically by the bridge — watch the container.
      function scanTiles() {
        var tiles = document.querySelectorAll("#agora-tiles .agora-tile");
        for (var i = 0; i < tiles.length; i++) enhanceTile(tiles[i]);
      }
      var tilesRoot = document.getElementById("agora-tiles");
      if (tilesRoot && window.MutationObserver) {
        new MutationObserver(scanTiles).observe(tilesRoot, { childList: true });
      }
      setInterval(scanTiles, 1000); // fallback for environments without observer

      // ---- Speaking indicator ----------------------------------------------
      // Wait until the bridge has created the Agora client, then ask Agora to
      // report per-user audio volumes and flip the .speaking class on tiles.
      var wired = false;
      var wait = setInterval(function () {
        var A = window.AgoraState;
        if (!A || !A.client || wired) return;
        wired = true;
        clearInterval(wait);
        try {
          // 200ms reporting interval; covers local + remote users.
          A.client.enableAudioVolumeIndicator();
          A.client.on("volume-indicator", function (volumes) {
            // Build a quick set of who is currently talking.
            var talking = {};
            for (var i = 0; i < volumes.length; i++) {
              var v = volumes[i];
              // uid 0 (or our own uid) represents the local user.
              var uid = (v.uid === 0 || v.uid === "0") ? A.myUid : v.uid;
              if (v.level > SPEAK_THRESHOLD) talking[String(uid)] = true;
            }
            // Apply to every tile.
            var tiles = document.querySelectorAll("#agora-tiles .agora-tile");
            for (var t = 0; t < tiles.length; t++) {
              var tu = tileUidFromEl(tiles[t]);
              if (tu == null) continue;
              tiles[t].classList.toggle("speaking", !!talking[String(tu)]);
            }
          });
          console.log("[AgoraUI] Speaking indicator wired.");
        } catch (e) {
          console.error("[AgoraUI] Could not enable volume indicator:", e);
        }
      }, 500);
    })();
  </script>

</body>

</html>
