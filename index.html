<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <title>Unity WebGL Player</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">

  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body style="margin:0; overflow:hidden">

  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>

  <!-- USER GESTURE REQUIRED FOR MIC -->
  <button id="voiceBtn"
    style="position:fixed;top:12px;left:12px;z-index:9999;padding:10px 14px;">
    Enable Voice
  </button>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/build.loader.js";

    const config = {
      dataUrl: buildUrl + "/build.data",
      frameworkUrl: buildUrl + "/build.framework.js",
      codeUrl: buildUrl + "/build.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Veonary",
      productName: "VeonaryLand",
      productVersion: "1.0"
    };

    const canvas = document.getElementById("unity-canvas");

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config).then((instance) => {
        window.unityInstance = instance;
        console.log("[Unity] Loaded");
      });
    };

    document.body.appendChild(script);
  </script>

  <!-- VOICE ENABLE BUTTON -->
  <script>
    document.getElementById("voiceBtn").onclick = () => {
      if (!window.unityInstance) return;

      window.unityInstance.SendMessage(
        "VoiceSignaling",
        "StartVoice"
      );

      document.getElementById("voiceBtn").innerText = "Voice Enabled";
    };
  </script>

</body>
</html>
