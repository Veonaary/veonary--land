<!-- ================= AUDIO CONTEXT FIX (NEW, REQUIRED) ================= -->
<script>
  window.globalAudioContext = null;

  function unlockAudioContext() {
    if (!window.globalAudioContext) {
      window.globalAudioContext =
        new (window.AudioContext || window.webkitAudioContext)();
      console.log('[Voice] Global AudioContext created');
    }

    if (window.globalAudioContext.state === 'suspended') {
      window.globalAudioContext.resume().then(() => {
        console.log('[Voice] AudioContext resumed by user gesture');
      });
    }
  }
</script>

  <div id="unity-loading-bar">

  </div>

  <div id="unity-footer">

<!-- ================= VOICE BUTTON ================= -->
<button id="voiceBtn"
style="
position:fixed;
z-index:9999;
top:20px;
left:20px;
padding:12px 20px;
font-size:16px;
font-weight:bold;
border-radius:8px;
border:2px solid #4CAF50;
background:#ffffff;
color:#333;
cursor:pointer;
">
🎤 Enable Voice
</button>

<script>
  var container = document.querySelector("#unity-container");
  var canvas = document.querySelector("#unity-canvas");
  var loadingBar = document.querySelector("#unity-loading-bar");
  var progressBarFull = document.querySelector("#unity-progress-bar-full");
  var fullscreenButton = document.querySelector("#unity-fullscreen-button");
  var warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(msg, type) {
    var div = document.createElement("div");
    div.innerHTML = msg;
    warningBanner.appendChild(div);
    if (type === "error") div.style = "background:red;color:white;";
    if (type === "warning") setTimeout(() => div.remove(), 5000);
  }

  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/veonary--land.loader.js";

  var config = {
    dataUrl: buildUrl + "/veonary--land.data.unityweb",
    frameworkUrl: buildUrl + "/veonary--land.framework.js.unityweb",
    codeUrl: buildUrl + "/veonary--land.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "WebProject",
    productVersion: "0.1.0",
    showBanner: unityShowBanner
  };

  loadingBar.style.display = "block";

  var script = document.createElement("script");
  script.src = loaderUrl;

  script.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
      progressBarFull.style.width = (100 * progress) + "%";
    }).then(function (unityInstance) {
      window.unityInstance = unityInstance;
      loadingBar.style.display = "none";
      fullscreenButton.onclick = () => unityInstance.SetFullscreen(1);
      console.log("Unity loaded successfully!");
    });
  };

  document.body.appendChild(script);
</script>

<!-- ================= VOICE BUTTON HANDLER ================= -->
<script>
  (function () {
    const btn = document.getElementById("voiceBtn");
    let enabled = false;

    btn.onclick = function () {
      if (!window.unityInstance || enabled) return;

      // 🔑 THIS IS THE CRITICAL FIX
      unlockAudioContext();

      window.unityInstance.SendMessage(
        "VoiceManager",
        "StartVoice"
      );

      enabled = true;
      btn.innerText = "✅ Voice Enabled";
      btn.disabled = true;

      console.log("[Voice] Enabled via user gesture");
    };
  })();
</script>
