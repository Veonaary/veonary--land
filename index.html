<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | WebProject</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body style="margin: 0; padding: 0;">

  <!-- 🔥 FIREBASE STUB - PREVENTS ALL FIREBASE ERRORS -->
  <script>
    if (typeof firebase === 'undefined') {
      window.firebase = {
        database: function() {
          return {
            ref: function(path) {
              console.log('[Firebase Stub] Reference:', path);
              return {
                push: function() { return { key: 'stub_key' }; },
                set: function(data) { 
                  console.log('[Firebase Stub] Set:', data);
                  return Promise.resolve(); 
                },
                update: function(data) { 
                  console.log('[Firebase Stub] Update:', data);
                  return Promise.resolve(); 
                },
                child: function(childPath) {
                  console.log('[Firebase Stub] Child:', childPath);
                  return this;
                },
                remove: function() { return Promise.resolve(); }
              };
            }
          };
        },
        initializeApp: function(config) {
          console.log('[Firebase Stub] Init:', config);
          return {};
        },
        analytics: function() { 
          return { 
            logEvent: function(name, params) {
              console.log('[Firebase Stub] Event:', name, params);
            } 
          }; 
        }
      };
      
      window.LogToFirebaseJS = function(path, jsonPayload) {
        console.log('[Firebase Stub] LogToFirebaseJS');
        console.log('  Path:', path);
        console.log('  Data:', jsonPayload);
      };
      
      console.log('[Firebase] Stub created ✓');
    }
  </script>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    
    <div id="unity-warning"></div>
    
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">WebProject</div>
    </div>
  </div>

  <!-- 🎤 VOICE BUTTON -->
  <button id="voiceBtn" style="position:fixed; z-index:9999; top:20px; left:20px; padding:12px 20px; font-size:16px; font-weight:bold; border-radius:8px; border:2px solid #4CAF50; background:#ffffff; color:#333; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2); transition:all 0.3s;">
    🎤 Enable Voice
  </button>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");


    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? "block" : "none";
      }
      
      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      
      if (type === "error") {
        div.style = "background: red; color: white; padding: 10px;";
      } else if (type === "warning") {
        div.style = "background: yellow; color: black; padding: 10px;";
        setTimeout(function() {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/veonary--land.loader.js";
    
    var config = {
      dataUrl: buildUrl + "/veonary--land.data.unityweb",
      frameworkUrl: buildUrl + "/veonary--land.framework.js.unityweb",
      codeUrl: buildUrl + "/veonary--land.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "WebProject",
      productVersion: "0.1.0",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.getElementsByTagName("head")[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "1920px";
      canvas.style.height = "1080px";
    }


    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then(function(unityInstance) {
        
        window.unityInstance = unityInstance;
        loadingBar.style.display = "none";
        
        
        fullscreenButton.onclick = function() {
          unityInstance.SetFullscreen(1);
        };
        
        console.log("Unity loaded successfully!");
        
      }).catch(function(message) {
        alert("Failed to load Unity: " + message);
      });
    };
    
    script.onerror = function() {
      alert("Failed to load Unity build files.");
    };
    
    document.body.appendChild(script);
  </script>

  <!-- 🔊 VOICE CHAT HANDLER -->
  <script>
    (function() {
      var voiceBtn = document.getElementById("voiceBtn");
      var isVoiceEnabled = false;
      
      voiceBtn.addEventListener("click", function() {
        
        if (!window.unityInstance) {
          console.warn("[Voice] Unity not ready");
          alert("Please wait for the game to load!");
          return;
        }
        
        if (isVoiceEnabled) {
          console.log("[Voice] Already enabled");
          return;
        }
        
        var unlockAudio = document.createElement("audio");
        unlockAudio.muted = true;
        unlockAudio.play().then(function() {
          console.log("[Voice] Audio unlocked");
        }).catch(function(err) {
          console.warn("[Voice] Audio unlock failed:", err);
        });
        
        try {
          window.unityInstance.SendMessage("VoiceManager", "StartVoice");
          
          isVoiceEnabled = true;
          voiceBtn.innerText = "✅ Voice Enabled";
          voiceBtn.style.background = "#4CAF50";
          voiceBtn.style.color = "white";
          voiceBtn.style.borderColor = "#45a049";
          voiceBtn.disabled = true;
          voiceBtn.style.cursor = "default";
          
          console.log("[Voice] Enabled successfully");
          
        } catch (err) {
          console.error("[Voice] Failed:", err);
          alert("Failed to enable voice chat");
        }
      });
      
      voiceBtn.addEventListener("mouseenter", function() {
        if (!isVoiceEnabled) {
          voiceBtn.style.background = "#f0f0f0";
          voiceBtn.style.transform = "scale(1.05)";
        }
      });
      
      voiceBtn.addEventListener("mouseleave", function() {
        if (!isVoiceEnabled) {
          voiceBtn.style.background = "#ffffff";
          voiceBtn.style.transform = "scale(1)";
        }
      });
      
    })();
  </script>

</body>
</html>
