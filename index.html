  <!-- Unity Loader -->
  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var loadingPercentage = document.querySelector("#loading-percentage");
    var loadingTip = document.querySelector(".loading-tip");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");

    // Loading tips
    const loadingTips = [
      "Initializing multiplayer systems…",
      "Loading the world…",
      "Connecting to the nearest region…",
      "Warming up voice chat…",
      "Almost there…"
    ];
    let tipIndex = 0;

    function updateLoadingTip() {
      if (loadingTip && tipIndex < loadingTips.length) {
        loadingTip.textContent = loadingTips[tipIndex];
        tipIndex++;
      }
    }

    // Only rotate tips during the INITIAL Unity download. Once loaded we stop the
    // interval so later load states (entering a world) can own the status line
    // without it being overwritten. window-scoped so the loader can clear it.
    window.__loadingTipTimer = setInterval(updateLoadingTip, 2000);

    function unityShowBanner(msg, type) {
      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type === "error") div.style = "background:red;color:white;padding:10px;";
      if (type === "warning") setTimeout(() => div.remove(), 5000);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/cee3bfd5589651a8b16e2a12b8abe5b3.loader.js";

    var config = {
      dataUrl: buildUrl + "/df1c482da8c28688d9f2e5863b10b7de.data.unityweb",
      frameworkUrl: buildUrl + "/634d4abc9c35b6fcf5734c36fe4b77bd.framework.js.unityweb",
      codeUrl: buildUrl + "/4f04c52fe80adad9bd69551876760f9e.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
    productName: "WebProject",
    productVersion: "0.1.0",
    showBanner: unityShowBanner
    };

    loadingBar.style.display = "flex";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = (100 * progress) + "%";
        loadingPercentage.textContent = Math.round(100 * progress) + "%";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;

        // Unity is fully loaded. Tear down the full-screen loading overlay:
        //  1) start the 0.6s opacity fade-out (CSS transition on #unity-loading-bar)
        //  2) reveal the canvas (it was visibility:hidden so the Unity splash /
        //     first blank frames were never shown to the user)
        //  3) once the fade finishes, remove the overlay from the DOM entirely
        //
        // The auth overlay sits above (z-index 3000) and fades in immediately, so
        // the sign-in card appears right away over the now-revealed world.
        loadingBar.classList.add('fade-out');

        // Reveal the Unity canvas now that the overlay is covering it during the
        // fade — the splash is already gone by the time the overlay clears.
        canvas.style.visibility = "visible";

        const authOverlay = document.getElementById('auth-overlay');
        if (authOverlay) {
          authOverlay.classList.add('visible');
          console.log('[Auth] Unity loaded! Showing authentication overlay...');
        }

        // Keep the overlay in the DOM (just hidden) so it can be REUSED as the
        // single loading screen for later load states (entering a world). After
        // the 0.6s fade, set display:none and reset its state for next time:
        //  - stop the initial tip rotation so it won't overwrite future statuses
        //  - clear the fade-out class so re-showing it is instantly opaque
        // 650ms = fade + small buffer.
        setTimeout(() => {
          if (window.__loadingTipTimer) { clearInterval(window.__loadingTipTimer); window.__loadingTipTimer = null; }
          if (loadingBar) {
            loadingBar.style.display = "none";
            loadingBar.classList.remove('fade-out');
          }
        }, 650);

        fullscreenButton.onclick = () => unityInstance.SetFullscreen(1);
        console.log("Unity loaded successfully!");
      }).catch(function (message) {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>

  <!-- Voice Button Handler -->
  <script>
    (function () {
      const btn = document.getElementById("voiceBtn");
      const indicator = document.getElementById("voiceIndicator");
      let enabled = false;
      let isMuted = false;

      btn.onclick = function () {
        if (!window.unityInstance) return;

        if (!enabled) {
          // First Time: Enable Voice
          unlockAudioContext();
          window.unityInstance.SendMessage("VoiceManager", "StartVoice");

          enabled = true;
          window.__voiceEnabled = true; // shared so the camera button can check
          btn.classList.add('active');
          btn.querySelector('.voice-text').textContent = "Mute Mic";
          indicator.classList.add('active');
          console.log("[Voice] Enabled via user gesture");
        } else {
          // Interaction: Toggle Mute. Drive the look entirely via classes so the
          // muted state is unambiguous: when muted, drop the 'active' (filled
          // accent + glow) look, add 'muted' (red) and hide the LIVE indicator;
          // when live again, restore 'active' and the indicator.
          isMuted = !isMuted;
          window.unityInstance.SendMessage("VoiceManager", "SetMute", isMuted ? 1 : 0);

          if (isMuted) {
            btn.querySelector('.voice-text').textContent = "Unmute";
            btn.classList.remove('active');
            btn.classList.add('muted');
            indicator.classList.remove('active');
          } else {
            btn.querySelector('.voice-text').textContent = "Mute Mic";
            btn.classList.remove('muted');
            btn.classList.add('active');
            indicator.classList.add('active');
          }
        }
      };
    })();
  </script>

  <!-- Camera Button Handler -->
  <script>
    (function () {
      const camBtn = document.getElementById("cameraBtn");
      if (!camBtn) return;
      let camOn = false;

      camBtn.onclick = function () {
        if (!window.unityInstance) return;

        // Camera and mic are independent: turning the camera on must NOT enable
        // the mic. The Agora channel is already joined (receive-only) on entering
        // the room, and the Unity SetCamera path joins it on demand if needed, so
        // the camera works on the first click without publishing the mic.
        // Unlock the audio context (gesture-gated, needed so remote audio plays)
        // but do not call StartVoice.
        unlockAudioContext();

        camOn = !camOn;
        window.unityInstance.SendMessage("VoiceManager", "SetCamera", camOn ? 1 : 0);

        if (camOn) {
          camBtn.classList.add('active');
          camBtn.querySelector('.cam-text').textContent = "Camera On";
        } else {
          camBtn.classList.remove('active');
          camBtn.querySelector('.cam-text').textContent = "Camera";
        }
        console.log("[Camera] Button toggled:", camOn);
      };
    })();
  </script>

  <!-- Keyboard Shortcuts: O = Voice, P = Camera. Mirrors the 'T' chat toggle
       so the mouse never has to leave pointer-lock to click these buttons. -->
  <script>
    (function () {
      function isTypingInPage() {
        if (window.__chatInputActive) return true; // Unity chat text field has focus
        const el = document.activeElement;
        if (!el) return false;
        const tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
      }

      window.addEventListener('keydown', function (e) {
        if (e.repeat) return;
        if (isTypingInPage()) return; // never hijack auth form / other text fields

        const key = e.key.toLowerCase();
        if (key === 'o') {
          const voiceBtn = document.getElementById('voiceBtn');
          if (voiceBtn) voiceBtn.click();
        } else if (key === 'p') {
          const camBtn = document.getElementById('cameraBtn');
          if (camBtn) camBtn.click();
        }
      });
    })();
  </script>

  <!-- Chat Button Handler -->
  <script>
    (function () {
      const chatBtn = document.getElementById("chatBtn");
      if (!chatBtn) return;
      let chatOn = false;

      // Reflect the button's on/off look. The actual toggle (T key inside
      // Unity) can also change state, so expose a setter Unity could call,
      // but the button itself is the source of truth for the click path.
      function applyState() {
        if (chatOn) {
          chatBtn.classList.add('active');
          chatBtn.querySelector('.chat-text').textContent = "Chat On";
        } else {
          chatBtn.classList.remove('active');
          chatBtn.querySelector('.chat-text').textContent = "Chat";
        }
      }

      chatBtn.onclick = function () {
        if (!window.unityInstance) return;
        chatOn = !chatOn;
        window.unityInstance.SendMessage("ChatManager", "JS_ToggleChat", chatOn ? 1 : 0);
        applyState();
        console.log("[Chat] Button toggled:", chatOn);
      };

      // Keep the button in sync if Unity toggles chat via the T key.
      window.__setChatButtonState = function (on) {
        chatOn = !!on;
        applyState();
      };
    })();
  </script>

  <!-- Screen Share Button Handler (admin only) -->
  <script>
    (function () {
      const screenBtn = document.getElementById("screenBtn");
      if (!screenBtn) return;
      let sharing = false;

      screenBtn.onclick = function () {
        if (!window.unityInstance) return;
        if (!window.__isAdmin) { console.warn("[Screen] Admin only."); return; }

        // Screen share must NOT enable the mic. The channel is already joined
        // (receive-only) on room entry, and the Unity SetScreen path joins it on
        // demand if needed. Unlock the audio context (gesture-gated) but leave
        // the mic alone.
        unlockAudioContext();

        sharing = !sharing;
        window.unityInstance.SendMessage("VoiceManager", "SetScreen", sharing ? 1 : 0);

        if (sharing) {
          screenBtn.classList.add('active');
          screenBtn.querySelector('.screen-text').textContent = "Stop Sharing";
        } else {
          screenBtn.classList.remove('active');
          screenBtn.querySelector('.screen-text').textContent = "Share Screen";
        }
        console.log("[Screen] Button toggled:", sharing);
      };
    })();
  </script>

  <!-- Responsive Handler -->
  <script>
    function handleResize() {
      const container = document.getElementById('unity-container');
      if (window.innerWidth <= 768) {
        container.classList.remove('unity-desktop');
        container.classList.add('unity-mobile');
      } else {
        container.classList.remove('unity-mobile');
        container.classList.add('unity-desktop');
      }
    }

    window.addEventListener('resize', handleResize);
    handleResize();
  </script>

  <!-- Authentication Handlers -->
  <script>
    // Function to hide the auth overlay
    window.hideAuthOverlay = function () {
      const overlay = document.getElementById('auth-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 500);
      }
    };

    // Wait for buttons to be clicked, then call Firebase directly
    // (These functions work because Firebase is loaded in the browser, not Unity)

    // Track whether we're in Sign In or Sign Up mode
    var isSignUpMode = false;

    // FIX: Prevent Unity from capturing keyboard input when typing in fields
    function stopPropagation(e) {
      e.stopPropagation();
    }

    const inputIds = ['authEmail', 'authPassword'];
    inputIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('keydown', stopPropagation);
        el.addEventListener('keyup', stopPropagation);
        el.addEventListener('keypress', stopPropagation);
      }
    });

    // Cursor-follow glow on the auth card (purely cosmetic).
    (function () {
      var card = document.querySelector('.auth-card');
      if (!card) return;
      card.addEventListener('pointermove', function (e) {
        var r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    })();

    // Helper to construct user data and check admin status
    // Helper to construct user data and check admin status
    function processUserAndSend(user) {
      // 1. Construct basic user data
      var safeName = 'Guest_' + user.uid.substring(0, 8);
      if (user.displayName) {
        safeName = user.displayName;
      } else if (user.email) {
        safeName = user.email.split('@')[0];
      }

      var userDataObj = {
        userId: user.uid,
        displayName: safeName,
        email: user.email || "",
        photoURL: user.photoURL || "",
        isAnonymous: user.isAnonymous,
        isAdmin: false // Default to false
      };

      // Admin status: the signed-in EMAIL is matched against the admin list at
      // /admin_emails in the Realtime Database (a comma-separated string of
      // emails). RTDB rules make that node read-only to clients, so admins can
      // only be changed from the Firebase console — manage clients' admins by
      // simply adding their email there. Match is case-insensitive + trimmed.
      var myEmail = (user.email || "").trim().toLowerCase();
      console.log('[Auth] Reading /admin_emails from RTDB to check:', myEmail);

      firebase.database().ref('admin_emails').once('value')
        .then(function (snap) {
          var isAdmin = false;
          if (myEmail && snap.exists()) {
            var raw = snap.val();
            var list = [];
            if (typeof raw === 'string') {
              list = raw.split(',');
            } else if (raw && typeof raw === 'object') {
              // Also support a { "email": true } object form.
              list = Object.keys(raw);
            }
            isAdmin = list.some(function (e) {
              return String(e).trim().toLowerCase() === myEmail;
            });
          }
          userDataObj.isAdmin = isAdmin;
          console.log('[Auth] isAdmin =', isAdmin);

          // Reveal the admin-only screen-share button.
          window.__isAdmin = isAdmin;
          if (isAdmin) {
            var sb = document.getElementById('screenBtn');
            if (sb) sb.style.display = '';
          }

          var finalJson = JSON.stringify(userDataObj);
          window.hideAuthOverlay();
          waitForUnityAndSend(finalJson);
        })
        .catch(function (err) {
          // Read failed (network, rules, etc). Send the user through as
          // non-admin rather than blocking login — they still get to play.
          console.error('[Auth] admin_emails read failed, defaulting to non-admin:', err);
          userDataObj.isAdmin = false;

          var finalJson = JSON.stringify(userDataObj);
          window.hideAuthOverlay();
          waitForUnityAndSend(finalJson);
        });
    }

    // Toggle between Sign In and Sign Up
    document.getElementById('toggleAuth').onclick = function (e) {
      e.preventDefault();
      isSignUpMode = !isSignUpMode;

      var subtitle = document.getElementById('auth-subtitle');
      var btnText = document.getElementById('emailAuthBtnText');
      var togglePrompt = document.getElementById('togglePrompt');
      var toggleLink = document.getElementById('toggleAuth');

      if (isSignUpMode) {
        subtitle.textContent = 'Create an account to get started';
        btnText.textContent = 'Sign Up';
        togglePrompt.textContent = 'Already have an account?';
        toggleLink.textContent = 'Sign In';
      } else {
        subtitle.textContent = 'Sign in to join the metaverse';
        btnText.textContent = 'Sign In';
        togglePrompt.textContent = "Don't have an account?";
        toggleLink.textContent = 'Sign Up';
      }
    };

    // Email/Password Authentication Button
    document.getElementById('emailAuthBtn').onclick = function () {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        alert('Please enter both email and password');
        return;
      }

      if (window.__authInProgress) { console.log('[Auth] Sign-in already in progress — ignoring extra click'); return; }
      window.__authInProgress = true;
      const emailBtn = document.getElementById('emailAuthBtn');
      emailBtn.classList.add('loading');

      if (isSignUpMode) {
        // Sign Up
        console.log('[Auth] Email Sign Up clicked');
        firebase.auth().createUserWithEmailAndPassword(email, password)
          .then(function (result) {
            console.log('[Auth] Sign up successful');
            processUserAndSend(result.user);
          })
          .catch(function (error) {
            window.__authInProgress = false;
            emailBtn.classList.remove('loading');
            console.error('[Auth] Sign up failed:', error);
            alert('Sign up failed: ' + error.message);
          });
      } else {
        // Sign In
        console.log('[Auth] Email Sign In clicked');
        firebase.auth().signInWithEmailAndPassword(email, password)
          .then(function (result) {
            console.log('[Auth] Email sign-in successful');
            processUserAndSend(result.user);
          })
          .catch(function (error) {
            window.__authInProgress = false;
            emailBtn.classList.remove('loading');
            console.error('[Auth] Email sign-in failed:', error);
            alert('Sign in failed: ' + error.message);
          });
      }
    };

    // Google Sign In Button
    document.getElementById('googleSignInBtn').onclick = function () {
      if (window.__authInProgress) { console.log('[Auth] Sign-in already in progress — ignoring extra click'); return; }
      window.__authInProgress = true;
      const googleBtn = document.getElementById('googleSignInBtn');
      googleBtn.classList.add('loading');

      console.log('[Auth] Google Sign In clicked');

      var provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider).then(function (result) {
        console.log('[Auth] Google sign-in successful');
        processUserAndSend(result.user);
      }).catch(function (error) {
        window.__authInProgress = false;
        googleBtn.classList.remove('loading');
        console.error('[Auth] Google sign-in failed:', error);
        alert('Sign in failed: ' + error.message);
      });
    };

    // Guest Sign In Button
    document.getElementById('guestSignInBtn').onclick = function () {
      // Guard: ignore repeat clicks while a sign-in is already in progress, so
      // a fast double/triple click can't fire multiple logins (each of which
      // would re-send OnLoginSuccess and re-connect Photon).
      if (window.__authInProgress) { console.log('[Auth] Sign-in already in progress — ignoring extra click'); return; }
      window.__authInProgress = true;
      const guestBtn = document.getElementById('guestSignInBtn');
      guestBtn.classList.add('loading');

      console.log('[Auth] Guest Sign In clicked');

      firebase.auth().signInAnonymously().then(function (result) {
        console.log('[Auth] Guest sign-in successful');
        processUserAndSend(result.user);
      }).catch(function (error) {
        window.__authInProgress = false; // allow retry on failure
        guestBtn.classList.remove('loading');
        console.error('[Auth] Guest sign-in failed:', error);
        alert('Sign in failed: ' + error.message);
      });
    };

    // Helper function to wait for Unity and send auth data
    function waitForUnityAndSend(userData) {
      var checkUnity = setInterval(function () {
        if (window.unityInstance) {
          clearInterval(checkUnity);
          console.log('[Auth] Sending to Unity AuthManager:', userData);
          window.unityInstance.SendMessage('AuthManager', 'OnLoginSuccess', userData);
        } else {
          console.log('[Auth] Waiting for Unity to load...');
        }
      }, 100); // Check every 100ms
    }
  </script>
