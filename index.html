<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | WebProject</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

  </head>

  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"
              width="1920"
              height="1080"
              tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>

        <div id="unity-build-title">WebProject</div>
      </div>
    </div>

    <!-- ENABLE VOICE BUTTON (MANDATORY FOR MIC ACCESS) -->
    <button id="voiceBtn"
      style="position:fixed;z-index:9999;top:16px;left:16px;padding:10px;">
      Enable Voice
    </button>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");


      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display =
            warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style = "background:red;padding:10px;";
        } else if (type === "warning") {
          div.style = "background:yellow;padding:10px;";
          setTimeout(() => {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/veonary--land.loader.js";

      var config = {
        dataUrl: buildUrl + "/veonary--land.data.unityweb",
        frameworkUrl: buildUrl + "/veonary--land.framework.js.unityweb",
        codeUrl: buildUrl + "/veonary--land.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "WebProject",
        productVersion: "0.1.0",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.head.appendChild(meta);

        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

      } else {
        canvas.style.width = "1920px";
        canvas.style.height = "1080px";
      }


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {

          // ⭐ CRITICAL: expose Unity instance for WebRTC voice
          window.unityInstance = unityInstance;

          loadingBar.style.display = "none";

          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>

    <!-- ENABLE VOICE CLICK HANDLER -->
    <script>
      document.getElementById("voiceBtn").addEventListener("click", () => {
        if (!window.unityInstance) {
          console.warn("Unity not ready yet");
          return;
        }
        window.unityInstance.SendMessage(
          "VoiceManager",
          "StartVoice"
        );
        document.getElementById("voiceBtn").innerText = "Voice Enabled";
      });
    </script>

    <!-- FIREBASE (UNCHANGED) -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "https://veonaryland-default-rtdb.firebaseio.com",
        projectId: "veonaryland",
        storageBucket: "veonaryland.firebasestorage.app"
      };
      firebase.initializeApp(firebaseConfig);
    </script>
  </body>
</html>
